# Backup Manager Configuration
# Copy this file to backup_config.yaml and fill in your real paths.

# Tool paths (relative to this config file's directory, or absolute)
tools:
  adb: platform-tools/adb.exe
  adbsync: path/to/adbsync.exe
  rclone: rclone/rclone.exe
  media_device_copier: MediaDeviceCopier.exe
  freefile_sync: "C:\\Program Files\\FreeFileSync\\FreeFileSync.exe"

jobs:
  # --- Android phone via ADB ---
  my_android_phone:
    name: "My Android Phone"
    type: adbsync
    group: device
    source: "/storage/emulated/0/"
    destination: "C:\\Backups\\Phone"
    exclude:
      - "*cache*"
      - "*.db*"

  # --- iPhone/iPad via MTP ---
  my_iphone:
    name: "My iPhone"
    type: mtp
    group: device
    device_name: "Apple iPhone"
    source: "Internal Storage\\DCIM"
    destination: "C:\\Backups\\iPhone Photos"
    recursive: true

  # --- Camera via FreeFileSync batch ---
  my_camera:
    name: "My Camera"
    type: ffs
    group: device
    ffs_batch: "Camera.ffs_batch"

  # --- reMarkable tablet over SSH/SFTP ---
  # RCU's whole-device snapshot is GUI-only, so the notebook data is pulled with
  # rclone instead. 10.11.99.1 is the tablet's address over USB. ssh-ed25519 is
  # not optional: the tablet's dropbear advertises an RSA host key it does not
  # actually have, and the handshake dies before rclone can ask for anything.
  my_remarkable:
    name: "My reMarkable"
    type: rclone
    group: device
    # --obscure so rclone never writes the password to rclone.conf in the clear.
    # Obscuring is reversible, so treat this line as plaintext: if this checkout
    # lives inside a tree another job backs up, the password goes with it.
    rclone_config_create: "remarkable sftp host=10.11.99.1 user=root pass=<root password> shell_type=unix md5sum_command=md5sum sha1sum_command=sha1sum --obscure"
    rclone_command: copy
    source: "remarkable:/home/root"
    destination: "C:\\Backups\\reMarkable"
    exclude:
      - "/.cache/**"
    flags:
      transfers: 4
      sftp-host-key-algorithms: ssh-ed25519

  # --- Rclone sync job ---
  files_to_nas:
    name: "Files to NAS"
    type: rclone
    group: sync
    depends_on:
      - my_android_phone
      - my_iphone
    rclone_command: copy
    source: "C:\\Users\\me\\Files"
    destination: "\\\\server\\nas\\files"
    flags:
      transfers: 8
      buffer-size: 32M

  # --- Rclone cloud sync ---
  files_to_google_drive:
    name: "Files to Google Drive"
    type: rclone
    group: sync
    depends_on:
      - my_android_phone
      - my_iphone
    rclone_command: copy
    source: "C:\\Users\\me\\Files"
    destination: "drive:Mirror"
    flags:
      transfers: 4
      drive-chunk-size: 32M
      checksum: true

  # --- Rclone with config creation (e.g. SFTP) ---
  remote_videos:
    name: "Remote Videos to NAS"
    type: rclone
    group: sync
    rclone_command: sync
    rclone_config_create: "myremote sftp host=myserver.local user=myuser key_file=path/to/key.pem"
    source: "myremote:/home/user/Videos"
    destination: "\\\\server\\nas\\media\\videos"
    flags:
      transfers: 4
      update: true

  # --- Custom script fallback ---
  custom_task:
    name: "Custom Script"
    type: script
    group: sync
    script_path: "my_custom_script.ps1"
